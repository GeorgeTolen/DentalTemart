services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temart}
      POSTGRES_DB: ${POSTGRES_DB:-temart}
    ports:
      # Host 5433 to avoid clashing with a native PostgreSQL on 5432.
      # Container-internal port stays 5432 (used by the backend service).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temart} -d ${POSTGRES_DB:-temart}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Свой мини-шлюз WhatsApp (Baileys): одна сессия на клинику, привязка по QR.
  # Порт опубликован только на localhost - для `make run` вне Docker.
  wa-gateway:
    build: ./wa-gateway
    environment:
      GATEWAY_TOKEN: ${WA_GATEWAY_TOKEN:-dev-gateway-token}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - wa_auth:/data/auth
    restart: unless-stopped

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-temart}:${POSTGRES_PASSWORD:-temart}@postgres:5432/${POSTGRES_DB:-temart}?sslmode=disable
      PORT: "8080"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ACCESS_TTL: ${ACCESS_TTL:-15m}
      REFRESH_TTL: ${REFRESH_TTL:-8760h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Platform superadmin (администратор платформы), bootstrapped on first start.
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Администратор платформы}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@temart.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-changeme123}
      # Онлайн-запись и уведомления клиентам.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MESSENGER_PROVIDER: ${MESSENGER_PROVIDER:-noop}
      WA_GATEWAY_URL: http://wa-gateway:3001
      WA_GATEWAY_TOKEN: ${WA_GATEWAY_TOKEN:-dev-gateway-token}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOOKING_DEBUG_CODE: ${BOOKING_DEBUG_CODE:-true}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
  wa_auth:
